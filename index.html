function render(){$('#app').innerHTML=(P[S.p]||P.home)()+nav();if(S.p==='games'){const f=$('#dg');f.onload=()=>{const d=f.contentDocument,fit=()=>{f.style.height=d.documentElement.scrollHeight+'px'};fit();new ResizeObserver(fit).observe(d.body)};f.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(DG),c=>c.charCodeAt(0)))}}
const setSt=(k,v)=>{db.status[k]=v;save();render()},bm=k=>{db.bm=db.bm.includes(k)?db.bm.filter(x=>x!==k):[...db.bm,k];save();render()};
function openUrl(u){if(!u)return toast('Link add nahi hai');const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);if(!m)return open(u,'_blank','noopener');const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000e;z-index:40;display:flex;flex-direction:column;justify-content:center';d.innerHTML='<button class="ib" style="align-self:flex-end;margin:10px">✕</button><iframe src="https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0&modestbranding=1&playsinline=1" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0"></iframe>';d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
function addMat(k){const t=$('#mt').value.trim();if(!t)return toast('Title likho');(db.mat[k]=db.mat[k]||[]).push({title:t,url:$('#mu').value.trim()});save();render()}
const delMat=(k,i)=>{db.mat[k].splice(i,1);save();render()};
function addSch(){const t=$('#sd').value.trim();if(!t)return toast('Kuch likho');db.sched.push({t,d:$('#sy').value});save();render()}
function addBatch(){const n=$('#bn').value.trim();if(!n)return toast('Batch name likho');db.batches.push({id:'b'+Date.now(),name:n,valid:$('#bv').value||'Not set',type:'Full Course',exam:'NEET 2027'});save();toast('Batch add ho gaya');render()}
function admAdd(){addMat($('#ac').value+':'+$('#at').value)}
function delBatch(i){if(db.batches.length<2)return toast('Kam se kam ek batch rakho');db.batches.splice(i,1);save();render()}
function setGoal(){const v=prompt('Aaj kitne ghante padhna hai?',db.goal||'');if(v!==null&&!isNaN(+v)){db.goal=+v;save();render()}}
function search(){const q=(prompt('Chapter ka naam search karo')||'').toLowerCase().trim();if(!q)return;const s=Object.keys(SUBJECTS).find(k=>SUBJECTS[k].some(c=>c.name.toLowerCase().includes(q)));if(!s)return toast('Kuch nahi mila');go('subject',{sub:s,tab:'Chapters',f:'All',all:true,q})}
function menu(){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center';m.onclick=()=>m.remove();m.innerHTML=`<div style="background:#fff;width:min(520px,100%);border-radius:22px 22px 0 0;padding:14px">${[['home','Home'],['progress','My Progress'],['schedule','My Schedule'],['bookmarks','Bookmarked'],['games','Ratta Games']].map(([p,t])=>`<button class="row" style="margin:6px 0;width:100%" onclick="go('${p}')"><span class="mid"><b>${t}</b></span>›</button>`).join('')}</div>`;document.body.appendChild(m)}
