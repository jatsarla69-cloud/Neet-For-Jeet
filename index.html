const state={page:'home',subject:'biology',chapter:null,tab:'Chapters',gameRound:1,gameScore:0,sequence:[],chosen:[],gamePhase:'idle',gameTimer:null,searchTerm:''};
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page){clearTimeout(state.gameTimer);state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});$('#view').focus({preventScroll:true})}
function header(title,sub=''){return `<div class="eyebrow">NEET 2027&nbsp; • &nbsp;DREAM DOCTOR</div><h1 class="hello">${title}</h1>${sub?`<p class="subtle">${sub}</p>`:''}`}

function home(){return `<section class="home-hero"><div class="brandline">🎓 NEET FOR JEET</div><span class="hero-kicker">NEET 2027</span><h1>Dream<br><em>Doctor</em></h1><p>Your goal is bigger than today. Make every study session count.</p></section><div class="feature-grid"><button class="feature" onclick="go('batches')"><span class="ficon">🎓</span><strong>My Batches</strong><small>Access your enrolled batches</small></button><button class="feature" onclick="go('progress')"><span class="ficon">📈</span><strong>My Progress</strong><small>Track your study journey</small></button><button class="feature" onclick="go('schedule')"><span class="ficon">🗓</span><strong>My Schedule</strong><small>Plan and manage your study</small></button><button class="feature" onclick="go('bookmarks')"><span class="ficon">🔖</span><strong>Bookmarked</strong><small>Your saved content</small></button><button class="feature wide" onclick="go('games')"><span class="ficon">🎮</span><span><strong>Ratta Games</strong><small>Learn • Revise • Retain</small></span><span style="margin-left:auto;font-size:25px">›</span></button><button class="feature wide" onclick="go('goal')"><span class="ficon">🎯</span><span><strong>Today's Goal</strong><small>Set your daily study target</small></span><span style="margin-left:auto;color:#7110c5;font-weight:800">＋ Set Goal</span></button></div><div class="section-head"><h3>Today's progress</h3><button class="text-btn" onclick="go('goal')">View details</button></div><div class="goal-card"><div class="goal-top"><strong>Daily goal completion</strong><b>${progressPercent()}%</b></div><div class="progress"><i style="width:${progressPercent()}%"></i></div><span class="subtle">Your progress is saved on this device</span></div>`}

function setBatchFilter(filter,btn){document.querySelectorAll('.batch-filters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const all=db.admin.batches||[];const arr=filter==='all'?all:filter==='ongoing'?all.filter(x=>x.status!=='upcoming'&&x.status!=='completed'):all.filter(x=>x.status===filter);const el=$('#batchList');if(el)el.innerHTML=batchCards(arr)}
function batchCards(arr){if(!arr.length)return '<div class="empty">No batches are available yet.</div>';return arr.map(b=>`<article class="batch-card"><div class="batch-art"><div><span class="pill">✓ ENROLLED</span><b>${esc(b.name)}</b><span style="font-size:13px;color:#e6c9ff">Batch for ${esc(b.target||'NEET UG')}</span></div></div><div class="batch-meta"><span class="tag">${esc(b.validity||'Validity not set')}</span><span class="tag">${esc(b.type||'Full Course')}</span><span class="tag">${esc(b.target||'NEET UG')}</span></div><button class="primary-btn" style="width:100%" onclick="openBatch('${esc(b.id)}')">▶ &nbsp; Open Batch &nbsp; ›</button></article>`).join('')}
function filterBatches(q){const arr=(db.admin.batches||[]).filter(b=>(b.name+' '+b.target).toLowerCase().includes(q.toLowerCase()));$('#batchList').innerHTML=batchCards(arr)}
function openBatch(id){state.batchId=id;go('batchDetail')}
function batchDetail(){const b=(db.admin.batches||[]).find(x=>x.id===state.batchId)||db.admin.batches[0]||{name:'NEET Batch'};return `${header(esc(b.name),'Choose a subject to continue.')}<div class="subject-grid"><button class="subject-card" onclick="openSubject('physics')"><span class="pill">SUBJECT</span><h3>Physics</h3><p>Explore chapters & practice</p><span class="orb">⚛</span></button><button class="subject-card" onclick="openSubject('biology')"><span class="pill">SUBJECT</span><h3>Biology</h3><p>Explore chapters & practice</p><span class="orb">🧬</span></button><button class="subject-card" onclick="openSubject('chemistry')"><span class="pill">SUBJECT</span><h3>Chemistry</h3><p>Explore chapters & practice</p><span class="orb">⚗</span></button></div>`}
function openSubject(s){state.subject=s;state.tab='Chapters';go('subject')}
function subjectPage(){const s=subjectNames[state.subject],chapters=window.SUBJECTS?.[state.subject]||[];return `${header(s,'Concepts • Practice • Revision')}<div class="subject-banner"><span class="pill">${s.toUpperCase()} • NEET UG</span><h2>${state.subject==='physics'?'⚛':state.subject==='biology'?'🧬':'⚗'} ${s}</h2><p>${chapters.length} chapter image sets available</p></div><div class="tabs">${['Chapters','DPP','PYQs','Tests'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div>${state.tab==='Chapters'?`<input class="search" placeholder="⌕  Search ${s} chapters..." oninput="filterChapters(this.value)"><div class="chapter-list" id="chapterList">${chapterCards(chapters)}</div>`:materialTab(state.tab,state.subject)}`}
function chapterCards(chapters){if(!chapters.length)return '<div class="empty">No chapter images found for this subject.</div>';return chapters.map(c=>`<button class="chapter-card" onclick="openChapter('${esc(c.no)}')"><img loading="lazy" src="${esc(c.cover)}" alt="${esc(c.name)}" onerror="this.onerror=null;this.src='${esc(c.logo)}'"><span class="chapter-info"><b>${esc(c.no)}. ${esc(c.name)}</b><small>Open chapter • Lectures & practice</small></span><span class="arrow">›</span></button>`).join('')}
function filterChapters(q){const arr=(window.SUBJECTS?.[state.subject]||[]).filter(c=>(c.name+' '+c.no).toLowerCase().includes(q.toLowerCase()));$('#chapterList').innerHTML=chapterCards(arr)}
function setTab(t){state.tab=t;render()}
function openChapter(no){state.chapter=(window.SUBJECTS?.[state.subject]||[]).find(x=>x.no===no);if(!state.chapter){toast('Chapter not found');return}state.tab='Lectures';go('chapter')}
function chapterPage(){const c=state.chapter;if(!c)return `${header('Chapter','Choose a chapter from the subject list.')}`;return `<button class="back" onclick="go('subject')">← Back to ${subjectNames[state.subject]}</button><div class="eyebrow">CHAPTER ${esc(c.no)}</div><h1 class="hello">${esc(c.name)}</h1><img class="detail-cover" src="${esc(c.cover)}" alt="${esc(c.name)}"><div class="tabs">${['Lectures','DPP','PYQs','Tests'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div>${state.tab==='Lectures'?lectureList(c):materialTab(state.tab,state.subject,c.no)}<button class="secondary-btn" style="margin-top:12px" onclick="bookmark('${state.subject}','${esc(c.no)}')">♡ ${isBookmarked(state.subject,c.no)?'Remove bookmark':'Save chapter'}</button>`}
function getMaterial(subject,chapter,tab){return (db.materials[`${subject}:${chapter||'all'}:${tab}`]||db.materials[`${subject}:all:${tab}`]||[])}
function materialTab(tab,subject,chapter='all'){const items=getMaterial(subject,chapter,tab);if(!items.length)return `<div class="empty"><div style="font-size:25px;margin-bottom:8px">✦</div><b>${tab} content not uploaded yet</b><p>Content will appear here after it is added through Admin.</p></div>`;return items.map((m,i)=>`<div class="list-row"><span class="round">${tab==='Tests'?'◷':tab==='DPP'?'✎':'▤'}</span><span class="row-content"><b>${esc(m.title)}</b><small>${esc(m.description||'Study material')}</small></span><button class="text-btn" onclick="openMaterial('${esc(subject)}','${esc(chapter)}','${esc(tab)}',${i})">Open</button></div>`).join('')}
function lectureList(c){const arr=getMaterial(state.subject,c.no,'Lectures');if(!arr.length)return `<div class="empty">No lectures uploaded for this chapter yet.<p>Admin can add lecture titles and video links.</p></div>`;return arr.map((m,i)=>`<div class="list-row"><span class="round">▶</span><span class="row-content"><b>${esc(m.title)}</b><small>${esc(m.description||'Video lesson')}</small></span><button class="text-btn" onclick="openMaterial('${state.subject}','${c.no}','Lectures',${i})">Play</button></div>`).join('')}
function openMaterial(subject,chapter,tab,index){const item=getMaterial(subject,chapter,tab)[index];if(!item)return;const root=$('#modalRoot');let body='';if(tab==='Lectures'){body=`<div class="video-frame">${item.url?`<video controls playsinline src="${esc(item.url)}"></video>`:'<div style="text-align:center;padding:20px"><div style="font-size:36px">▶</div><p>Video URL has not been added.</p></div>'}</div><p class="subtle">Playback depends on a valid, accessible video URL.</p>`}else body=`<p>${esc(item.description||'')}</p>${item.url?`<a href="${esc(item.url)}" target="_blank" rel="noopener">Open resource ↗</a>`:''}`;root.innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><section class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3>${esc(item.title)}</h3><button class="close-btn" onclick="closeModal()">×</button></div>${body}</section></div>`}
function closeModal(e){if(!e||e.target.classList.contains('modal-backdrop'))$('#modalRoot').innerHTML=''}
function isBookmarked(s,n){return (db.bookmarks||[]).includes(`${s}:${n}`)}
function bookmark(s,n){const key=`${s}:${n}`;db.bookmarks=isBookmarked(s,n)?db.bookmarks.filter(x=>x!==key):[...db.bookmarks,key];persist();toast(isBookmarked(s,n)?'Chapter bookmarked':'Bookmark removed');render()}
function bookmarks(){const arr=(db.bookmarks||[]).map(key=>{const [s,n]=key.split(':');const c=(window.SUBJECTS?.[s]||[]).find(x=>x.no===n);return c?`<button class="chapter-card" onclick="state.subject='${s}';openChapter('${n}')"><img src="${esc(c.logo)}" alt=""><span class="chapter-info"><b>${esc(c.name)}</b><small>${subjectNames[s]}</small></span><span class="arrow">›</span></button>`:''}).join('');return `${header('Bookmarked','Your saved chapters.')}<div class="chapter-list">${arr||'<div class="empty">No bookmarks yet. Save chapters to find them here.</div>'}</div>`}
function games(){return `${header('Ratta Games','Make revision active, not boring.')}<div class="game-card"><span class="pill">BRAIN TRAINING • GAME 01</span><h3>Dimension Game</h3><p>Memorise the glowing sequence on the 3×3 grid, then repeat it in the same order. Each round adds another tile.</p><button class="hero-cta" onclick="startGame()">Play Dimension Game →</button></div><div class="stat-grid"><div class="stat"><strong>${db.gameBest||0}</strong><small>Best score</small></div><div class="stat"><strong>${db.gamePoints||0}</strong><small>Total points</small></div></div><div class="notice">This is a built-in sequence-memory version. The original Dimension Game source file was not included in the uploaded ZIP.</div>`}
function startGame(){state.gameRound=1;state.gameScore=0;state.gamePhase='idle';state.sequence=[];state.chosen=[];go('dimension')}
function dimension(){return `${header('Dimension Game','Watch the tiles, then repeat their order.')}<div class="progress-card"><div class="goal-top"><b>Round ${state.gameRound}</b><b>Score: ${state.gameScore}</b></div><p class="subtle" id="gameHint">Press Start when you are ready.</p><div class="cube-board">${Array.from({length:9},(_,i)=>`<button class="cube" id="cube${i}" onclick="tapCube(${i})" aria-label="Grid tile ${i+1}">${['◇','○','△','□','✦','⬡','◈','▽','✧'][i]}</button>`).join('')}</div><div class="inline-row"><button class="secondary-btn" onclick="go('games')">Exit game</button><button class="primary-btn" id="gameStart" onclick="beginRound()">Start round</button></div></div>`}
function beginRound(){if(state.gamePhase==='show')return;state.sequence=Array.from({length:Math.min(2+state.gameRound,8)},()=>Math.floor(Math.random()*9));state.chosen=[];state.gamePhase='show';$('#gameHint').textContent='Watch the sequence…';$('#gameStart').disabled=true;let i=0;const flash=()=>{if(i>=state.sequence.length){document.querySelectorAll('.cube').forEach(b=>b.classList.remove('selected'));state.gamePhase='input';$('#gameHint').textContent='Your turn — repeat the sequence.';$('#gameStart').disabled=false;return}const b=$(`#cube${state.sequence[i]}`);b.classList.add('selected');state.gameTimer=setTimeout(()=>{b.classList.remove('selected');i++;state.gameTimer=setTimeout(flash,250)},520)};state.gameTimer=setTimeout(flash,250)}
function tapCube(i){if(state.gamePhase!=='input')return;const b=$(`#cube${i}`);b.classList.add('selected');setTimeout(()=>b.classList.remove('selected'),170);const expected=state.sequence[state.chosen.length];if(i!==expected){state.gamePhase='over';$('#gameHint').textContent=`Sequence missed. Score: ${state.gameScore}. Try another round.`;db.gameBest=Math.max(db.gameBest||0,state.gameScore);db.gamePoints=(db.gamePoints||0)+state.gameScore;persist();$('#gameStart').textContent='Play again';$('#gameStart').onclick=startGame;return}state.chosen.push(i);if(state.chosen.length===state.sequence.length){state.gameScore+=state.gameRound*10;state.gameRound++;state.gamePhase='won';$('#gameHint').textContent='Correct! You completed the round.';$('#gameStart').textContent='Next round';$('#gameStart').disabled=false;$('#gameStart').onclick=beginRound}}
function progress(){const total=(db.admin.batches||[]).length;return `${header('My Progress','Your activity saved on this device.')}<div class="stat-grid"><div class="stat"><strong>${progressPercent()}%</strong><small>Daily goal</small></div><div class="stat"><strong>${db.bookmarks.length}</strong><small>Saved chapters</small></div><div class="stat"><strong>${db.gameBest||0}</strong><small>Game best score</small></div><div class="stat"><strong>${total}</strong><small>Available batches</small></div></div><div class="progress-card" style="margin-top:12px"><h3 style="font:700 14px Poppins">Daily goal progress</h3><div class="progress"><i style="width:${progressPercent()}%"></i></div><p class="subtle">Lecture completion and test analytics will appear after learning content and backend tracking are connected.</p><button class="secondary-btn" onclick="go('goal')">Update today's goal</button></div>`}
function goal(){return `${header("Today's Goal",'Set a daily target and track completion.')}<div class="progress-card"><label class="field-label">Daily study target (hours)</label><input class="form-control" id="goalHours" type="number" min="1" max="18" value="${db.goalHours||8}"><label class="field-label">Goal completion (%)</label><input class="goal-range" id="goalDone" type="range" min="0" max="100" value="${progressPercent()}" oninput="$('#goalLabel').textContent=this.value+'%' "><p class="subtle" id="goalLabel">${progressPercent()}%</p><button class="primary-btn" onclick="saveGoal()">Save today's goal</button></div>`}
function saveGoal(){db.goalHours=Math.max(1,Math.min(18,Number($('#goalHours').value)||8));db.done=Number($('#goalDone').value);persist();toast('Goal saved');render()}
function schedule(){const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];return `${header('My Schedule','Plan your weekly study targets.')}<div class="panel">${days.map(d=>`<label class="field-label">${d}<input class="form-control" data-day="${d}" placeholder="e.g. Physics — Laws of Motion" value="${esc(db.schedule[d]||'')}"></label>`).join('')}<button class="primary-btn" onclick="saveSchedule()">Save schedule</button></div>`}
function saveSchedule(){document.querySelectorAll('[data-day]').forEach(el=>db.schedule[el.dataset.day]=el.value);persist();toast('Weekly schedule saved')}
function simplePage(title,desc){return `${header(title,desc)}<div class="empty">No content has been added here yet.<p>Once your admin uploads actual study materials, they will appear in this section.</p></div>`}
function admin(){return `${header('Admin Panel','Local content manager • changes stay on this device.')}<div class="notice">This is a front-end demo admin panel. It does not provide secure multi-user administration or cloud publishing.</div><div class="panel"><h3 style="font:700 14px Poppins">Add a batch</h3><label class="field-label">Batch name<input id="newBatchName" class="form-control" placeholder="Yakeen NEET 2027"></label><label class="field-label">Target exam<input id="newBatchTarget" class="form-control" value="NEET UG"></label><label class="field-label">Type<input id="newBatchType" class="form-control" value="Recorded"></label><button class="primary-btn" onclick="addBatch()">Add batch</button></div><div class="panel" style="margin-top:12px"><h3 style="font:700 14px Poppins">Add learning content</h3><label class="field-label">Subject<select id="adminSubject" class="form-control"><option value="physics">Physics</option><option value="biology">Biology</option><option value="chemistry">Chemistry</option></select></label><label class="field-label">Chapter<select id="adminChapter" class="form-control">${Object.entries(window.SUBJECTS||{}).flatMap(([s,arr])=>arr.map(c=>`<option value="${s}:${c.no}">${subjectNames[s]} — ${esc(c.name)}</option>`)).join('')}</select></label><label class="field-label">Content type<select id="adminType" class="form-control"><option>Lectures</option><option>DPP</option><option>PYQs</option><option>Tests</option></select></label><label class="field-label">Title<input id="adminTitle" class="form-control" placeholder="Lecture 01"></label><label class="field-label">Description<input id="adminDesc" class="form-control" placeholder="Optional details"></label><label class="field-label">Video/resource URL<input id="adminUrl" class="form-control" placeholder="https://..."></label><button class="primary-btn" onclick="addMaterial()">Save content</button></div>`}
function addBatch(){const name=$('#newBatchName').value.trim();if(!name){toast('Enter a batch name');return}db.admin.batches.push({id:'batch-'+Date.now(),name,target:$('#newBatchTarget').value.trim(),type:$('#newBatchType').value.trim(),validity:'Not set',enrolled:true});persist();toast('Batch added');render()}
function addMaterial(){const [s,n]=$('#adminChapter').value.split(':');const tab=$('#adminType').value;const title=$('#adminTitle').value.trim();if(!title){toast('Enter a title');return}const key=`${s}:${n}:${tab}`;db.materials[key]=db.materials[key]||[];db.materials[key].push({title,description:$('#adminDesc').value.trim(),url:$('#adminUrl').value.trim()});persist();toast(`${tab} content saved`);$('#adminTitle').value='';$('#adminDesc').value='';$('#adminUrl').value=''}
function searchAll(){const q=prompt('Search chapters, subjects or batches');if(!q)return;const found=Object.entries(window.SUBJECTS||{}).flatMap(([s,arr])=>arr.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map(c=>({s,c})));if(found.length){state.subject=found[0].s;openChapter(found[0].c.no);return}go('batches');const input=$('.search');if(input){input.value=q;filterBatches(q)}}
function render(){const pages={home,batches,batchDetail,subject:subjectPage,chapter:chapterPage,bookmarks,games,dimension,progress,goal,schedule,admin,practice:()=>simplePage('Practice','DPPs and PYQs from your enrolled batch.'),tests:()=>simplePage('Tests','Your scheduled and completed tests.'),library:()=>simplePage('Library','Study PDFs and saved resources.')};view.innerHTML=(pages[state.page]||home)();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page||(['batchDetail','subject','chapter'].includes(state.page)&&b.dataset.nav==='batches')||(['games','dimension'].includes(state.page)&&b.dataset.nav==='practice')))}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav==='practice'?'games':b.dataset.nav)));
$('#menuBtn').onclick=()=>{const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><section class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h3>Menu</h3><button class="close-btn" onclick="closeModal()">×</button></div>${[['home','Home'],['progress','My Progress'],['schedule','My Schedule'],['bookmarks','Bookmarked'],['games','Ratta Games'],['admin','Admin Panel']].map(([p,t])=>`<div class="list-row" onclick="closeModal();go('${p}')"><span class="row-content"><b>${t}</b></span><span class="arrow">›</span></div>`).join('')}</section></div>`};
$('#profileBtn').onclick=()=>{const name=prompt('Enter your display name',db.profile.name||'Student');if(name&&name.trim()){db.profile.name=name.trim();persist();render()}};
$('#searchBtn').onclick=searchAll;$('#noticeBtn').onclick=()=>toast('No new announcements');
render();
if('serviceWorker'in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

</script>
</body></html>
